<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('login')">Login</button>
                <button class="tab-btn" onclick="showTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <div id="login" class="tab-content active">
                <h2>User Login</h2>
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">Email:</label>
                        <input type="email" id="login-email" name="email" required>
                        <span class="error" id="login-email-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password:</label>
                        <input type="password" id="login-password" name="password" required>
                        <span class="error" id="login-password-error"></span>
                    </div>
                    <div class="form-group checkbox">
                        <input type="checkbox" id="remember-me" name="remember">
                        <label for="remember-me">Remember me</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </form>
                <div id="loginMessage" class="message"></div>
            </div>

            <!-- Registration Form -->
            <div id="register" class="tab-content">
                <h2>Create New Account</h2>
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="register-fullname">Full Name:</label>
                        <input type="text" id="register-fullname" name="fullname" required>
                        <span class="error" id="fullname-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email:</label>
                        <input type="email" id="register-email" name="email" required>
                        <span class="error" id="register-email-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="register-phone">Phone Number:</label>
                        <input type="tel" id="register-phone" name="phone" required>
                        <span class="error" id="phone-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password:</label>
                        <input type="password" id="register-password" name="password" required>
                        <span class="error" id="register-password-error"></span>
                        <div class="password-strength">
                            <div class="strength-meter" id="strengthMeter"></div>
                            <span id="strengthText"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password">Confirm Password:</label>
                        <input type="password" id="register-confirm-password" name="confirm_password" required>
                        <span class="error" id="confirm-password-error"></span>
                    </div>
                    <div class="form-group checkbox">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the Terms and Conditions</label>
                        <span class="error" id="terms-error"></span>
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
                <div id="registerMessage" class="message"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
